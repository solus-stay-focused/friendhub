name: Generate Blog

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'   # adjust/remove to match your original trigger

# ---------------------------------------------------------------------
# THIS WAS THE MISSING PIECE. Without it, the built-in GITHUB_TOKEN
# only has read access to the repo, so the "git push" step in
# "Commit and push if changed" gets rejected with a 403 — which is
# exactly what causes the "exit code 128" failure you're seeing.
# ---------------------------------------------------------------------
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Make sure checkout uses a token that can push. actions/checkout
          # uses GITHUB_TOKEN by default, which is fine now that we've
          # granted contents: write above.
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate blog pages
        run: node scripts/generate-blog.js

      - name: Commit and push if changed
        run: |
          git config user.name "friendhub-blog-bot"
          git config user.email "friendhub-blog-bot@users.noreply.github.com"
          git add blog/ sitemap.xml
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: regenerate blog pages"
          git push

      # ---------------------------------------------------------------
      # Only keep this step if you've actually created the
      # FIREBASE_SERVICE_ACCOUNT_FRIENDHUB_9F934 secret in
      # Settings → Secrets and variables → Actions.
      # If you haven't set that up yet, DELETE this step for now —
      # it will fail the whole run otherwise, and generate + commit
      # will still work fine without it.
      # ---------------------------------------------------------------
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_FRIENDHUB_9F934 }}'
          channelId: live
          projectId: friendhub-9f934
