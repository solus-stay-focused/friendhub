name: Generate Blog

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'   # adjust/remove to match your original trigger

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate blog pages
        run: node scripts/generate-blog.js

      - name: Commit and push if changed
        run: |
          git config user.name "friendhub-blog-bot"
          git config user.email "friendhub-blog-bot@users.noreply.github.com"
          git add blog/ sitemap.xml
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: regenerate blog pages"
          git push

      # ---------------------------------------------------------------
      # continue-on-error: true means this step won't fail the whole
      # run while FIREBASE_SERVICE_ACCOUNT_FRIENDHUB_9F934 is missing.
      # Generate + commit + push will always succeed regardless.
      #
      # Once you add that secret (Settings → Secrets and variables →
      # Actions → New repository secret), this step will start
      # actually deploying — no other changes needed.
      # ---------------------------------------------------------------
      - name: Deploy to Firebase Hosting
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_FRIENDHUB_9F934 }}'
          channelId: live
          projectId: friendhub-9f934
