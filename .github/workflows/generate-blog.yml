name: Generate static blog pages

on:
  # Run automatically after a post is published in Firestore.
  # GitHub Actions cannot directly receive a Firestore trigger, so this
  # scheduled check keeps the static pages updated automatically.
  schedule:
    - cron: "*/5 * * * *"

  # Keep manual generation available from the Actions tab.
  workflow_dispatch: {}

  # Also regenerate when the generator or blog template changes.
  push:
    branches: [main]
    paths:
      - "scripts/generate-blog.js"
      - "blog-post.html"

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate blog pages
        run: node scripts/generate-blog.js

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "friendhub-blog-bot"
          git config user.email "actions@users.noreply.github.com"

          git add blog/ sitemap.xml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-generate static blog pages [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run static.yml --ref main
