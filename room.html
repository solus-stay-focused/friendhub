<style>
  :root{
    --void:#14152B;
    --void-deep:#0D0E1F;
    --paper:#EDE7DA;
    --mint:#5EEAD4;
    --coral:#FF6B5B;
    --violet:#9C8CFB;
    --violet-deep:#5142C4;
    --line:rgba(237,231,218,0.14);
    --card:rgba(255,255,255,0.05);
    --card-border:rgba(255,255,255,0.09);
    --ink-soft:rgba(245,244,251,0.62);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--void-deep); }
  body{
    font-family:'Inter',sans-serif;
    color:var(--paper);
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; min-height:100vh;
  }
  h1,h2,h3{ font-family:'Space Grotesk',sans-serif; margin:0; letter-spacing:-0.01em; }
  a{ color:inherit; text-decoration:none; }

  /* ---------- nav ---------- */
  .rnav{
    background:rgba(11,12,30,0.92);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(255,255,255,0.08);
    flex:none;
  }
  .rnav-inner{
    max-width:1400px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 6vw;
  }
  .rnav-left{ display:flex; align-items:center; gap:16px; }
  .rnav-back{
    display:flex; align-items:center; gap:6px;
    font-size:13.5px; font-weight:600; color:rgba(255,255,255,0.65);
    transition:color .15s ease;
  }
  .rnav-back:hover{ color:#fff; }
  .rnav-back svg{ width:15px; height:15px; }
  .rnav-brand{ display:flex; align-items:center; gap:9px; }
  .rnav-brand svg{ width:26px; height:26px; flex:none; }
  .rnav-brand span{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px; color:#fff; }
  .rnav-brand span em{ font-style:normal; color:var(--violet); }
  .rnav-account{ display:flex; align-items:center; gap:8px; font-size:13px; }
  .rnav-account img{ width:26px; height:26px; border-radius:50%; }

  /* ---------- room header ---------- */
  .rhead{
    padding:16px 6vw;
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; flex-wrap:wrap;
    border-bottom:1px solid var(--line);
    flex:none;
  }
  .rhead-left{ display:flex; align-items:center; gap:14px; }
  .rhead-icon{
    flex:none; width:46px; height:46px; border-radius:13px;
    display:flex; align-items:center; justify-content:center; font-size:22px;
    background:var(--tint, rgba(156,140,251,0.14));
    border:1px solid var(--tint-border, rgba(156,140,251,0.32));
  }
  .rhead h1{ font-size:19px; color:#fff; }
  .rhead p{ margin:2px 0 0; font-size:13px; color:var(--ink-soft); }
  .rhead-online{
    display:flex; align-items:center; gap:7px;
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--mint);
    background:rgba(94,234,212,0.08); border:1px solid rgba(94,234,212,0.22);
    border-radius:999px; padding:7px 14px;
  }
  .rhead-online .dot{ width:7px; height:7px; border-radius:50%; background:var(--mint); box-shadow:0 0 0 3px rgba(94,234,212,0.15); }

  /* ---------- chat area ---------- */
  .rmain{
    flex:1 1 auto; min-height:0;
    max-width:900px; width:100%; margin:0 auto;
    display:flex; flex-direction:column;
    padding:0 6vw;
  }
  .rlog{
    flex:1 1 auto; min-height:0;
    overflow-y:auto;
    padding:20px 0;
    display:flex; flex-direction:column; gap:14px;
  }
  .rmsg{ max-width:74%; display:flex; flex-direction:column; gap:4px; }
  .rmsg.me{ align-self:flex-end; align-items:flex-end; }
  .rmsg .who{
    display:flex; align-items:center; gap:6px;
    font-size:11.5px; color:rgba(237,231,218,0.45); font-weight:600;
  }
  .rmsg .who img{ width:16px; height:16px; border-radius:50%; }
  .rmsg .bubble{
    background:rgba(237,231,218,0.06);
    border-radius:14px 14px 14px 4px;
    padding:10px 14px;
    font-size:14px; line-height:1.5;
  }
  .rmsg.me .bubble{
    background:linear-gradient(135deg, rgba(94,234,212,0.22), rgba(94,234,212,0.1));
    border-radius:14px 14px 4px 14px;
  }
  .rmsg.system{ align-self:center; max-width:none; }
  .rmsg.system .bubble{
    background:transparent; color:rgba(237,231,218,0.4);
    font-style:italic; font-size:12.5px; padding:0;
  }
  .rlog-empty{
    margin:auto; text-align:center; color:rgba(237,231,218,0.4); font-size:13.5px; padding:40px 20px;
  }

  .rinput-row{
    flex:none;
    display:flex; align-items:center; gap:12px;
    padding:16px 0 22px;
    border-top:1px solid var(--line);
  }
  .rinput-row input{
    flex:1 1 auto;
    background:var(--void); border:1px solid var(--line); color:var(--paper);
    border-radius:12px; padding:14px 16px; font-family:inherit; font-size:14.5px;
  }
  .rinput-row input::placeholder{ color:rgba(237,231,218,0.35); }
  .rinput-row input:focus{ outline:none; border-color:var(--violet); }
  .rinput-row button{
    flex:none; display:flex; align-items:center; gap:8px;
    background:linear-gradient(135deg,#8B7CF6,#5142C4); color:#fff; border:none;
    border-radius:12px; padding:0 22px; height:48px;
    font-family:inherit; font-weight:600; font-size:14.5px; cursor:pointer;
    box-shadow:0 4px 14px rgba(81,66,196,0.35);
    transition:filter .15s ease, transform .15s ease;
  }
  .rinput-row button:hover{ filter:brightness(1.08); }
  .rinput-row button:active{ transform:translateY(1px); }
  .rinput-row button:disabled{ opacity:0.5; cursor:not-allowed; }
  .rinput-row button svg{ width:16px; height:16px; flex:none; }

  .rnotfound{
    flex:1 1 auto; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; text-align:center; padding:40px 20px;
  }
  .rnotfound h2{ font-size:22px; color:#fff; }
  .rnotfound p{ color:var(--ink-soft); font-size:14px; max-width:360px; }
  .rnotfound a{
    display:inline-flex; align-items:center; gap:8px;
    background:linear-gradient(135deg,#8B7CF6,#5142C4); color:#fff;
    border-radius:10px; padding:11px 20px; font-weight:600; font-size:14px;
  }
</style>
</head>

<div id="rRoomFound">

    <div class="rinput-row">

    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
(function(){
  const topic = new URLSearchParams(window.location.search).get('topic');

  const firebaseConfig = {
    apiKey: "AIzaSyAGq-OE8k2tfF0xIQHMYWIfAQ4JVS69gKs",
    authDomain: "friendhub-9f934.firebaseapp.com",
    projectId: "friendhub-9f934",
    storageBucket: "friendhub-9f934.firebasestorage.app",
    messagingSenderId: "97544296104",
    appId: "1:97544296104:web:d7f7d27e86f1af748e949d"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const FieldValue = firebase.firestore.FieldValue;

  const navAccount = document.getElementById('rNavAccount');
  const navAvatar = document.getElementById('rNavAvatar');
  const navName = document.getElementById('rNavName');
  const log = document.getElementById('rLog');
  const logEmpty = document.getElementById('rLogEmpty');
  const input = document.getElementById('rInput');
  const sendBtn = document.getElementById('rSendBtn');
  const onlineCountEl = document.getElementById('rOnlineCount');

  if (!document.getElementById('rRoomFound') || document.getElementById('rRoomFound').style.display === 'none') {
    return; // unknown room — nothing below needs to run
  }

  let myUser = null;
  let unsubMessages = null;

  auth.onAuthStateChanged((user) => {
    if (user && !user.isAnonymous) {
      myUser = user;
      navAccount.style.display = 'flex';
      navAvatar.src = user.photoURL || ('https://ui-avatars.com/api/?background=5142C4&color=fff&name=' + encodeURIComponent(user.displayName || user.email || 'U'));
      navName.textContent = (user.displayName || user.email || 'Account').split(' ')[0];
      input.disabled = false;
      sendBtn.disabled = false;
      startRoom();
    } else {
      // Anonymous or fully signed out — chat rooms are a gated action, same
      // as Start on the main page, so bounce to home where the sign-in
      // overlay lives rather than duplicating that flow here.
      window.location.href = '/?signin=1&next=' + encodeURIComponent(window.location.pathname + window.location.search);
    }
  });

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function addMessageEl(m, mine){
    logEmpty.style.display = 'none';
    const row = document.createElement('div');
    row.className = 'rmsg' + (mine ? ' me' : '');
    const nameHtml = mine ? '' :
      '<div class="who">' +
        (m.senderPhoto ? '<img src="' + m.senderPhoto + '" alt="">' : '') +
        '<span>' + escapeHtml(m.senderName || 'Someone') + '</span>' +
      '</div>';
    row.innerHTML = nameHtml + '<div class="bubble"></div>';
    row.querySelector('.bubble').textContent = m.text;
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
  }

  function startRoom(){
    if (unsubMessages) return; // already listening
    const messagesRef = db.collection('communityRooms').doc(topic).collection('messages')
      .orderBy('createdAt', 'asc').limitToLast(50);

    unsubMessages = messagesRef.onSnapshot((snap) => {
      snap.docChanges().forEach((change) => {
        if (change.type === 'added') {
          const m = change.doc.data();
          if (!m.createdAt) return; // ignore the optimistic local echo firestore sometimes emits pre-write
          addMessageEl(m, m.sender === myUser.uid);
        }
      });
    }, (err) => {
      console.error('messages listener failed:', err);
      logEmpty.textContent = 'Could not load messages — check Firestore rules for /communityRooms.';
      logEmpty.style.display = 'block';
    });

    touchPresence();
    setInterval(touchPresence, 15000);
    refreshOnlineCount();
    setInterval(refreshOnlineCount, 8000);
    window.addEventListener('pagehide', () => {
      if (myUser) db.collection('roomPresence').doc(topic + '_' + myUser.uid).delete().catch(() => {});
    });
  }

  function touchPresence(){
    if (!myUser) return;
    db.collection('roomPresence').doc(topic + '_' + myUser.uid).set({
      topic: topic,
      updatedAt: FieldValue.serverTimestamp()
    }, { merge: true }).catch((err) => console.error('room presence write failed:', err));
  }

  function refreshOnlineCount(){
    const cutoff = firebase.firestore.Timestamp.fromMillis(Date.now() - 30000);
    db.collection('roomPresence')
      .where('topic', '==', topic)
      .where('updatedAt', '>', cutoff)
      .get()
      .then((snap) => { onlineCountEl.textContent = snap.size.toLocaleString(); })
      .catch(() => { onlineCountEl.textContent = '—'; });
  }

  function sendMessage(){
    const text = input.value.trim();
    if (!text || !myUser) return;
    input.value = '';
    db.collection('communityRooms').doc(topic).collection('messages').add({
      text: text,
      sender: myUser.uid,
      senderName: myUser.displayName || 'Someone',
      senderPhoto: myUser.photoURL || null,
      createdAt: FieldValue.serverTimestamp()
    }).catch((err) => {
      console.error('send failed:', err);
      input.value = text; // restore so they don't lose what they typed
    });
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
})();
</script>

</body>
</html>
