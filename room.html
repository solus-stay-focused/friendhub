<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Room — FriendHub</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --void: #0B0C1E;
      --void-card: #14152B;
      --void-deep: #080915;
      --paper: #EDE7DA;
      --mint: #5EEAD4;
      --coral: #FF6B5B;
      --violet: #9C8CFB;
      --violet-btn: #7C66DC;
      --violet-gradient: linear-gradient(135deg, #8B7CF6 0%, #5142C4 100%);
      --line: rgba(255, 255, 255, 0.08);
      --line-subtle: rgba(237, 231, 218, 0.12);
      --card-bg: rgba(255, 255, 255, 0.03);
      --ink-soft: rgba(245, 244, 251, 0.60);
      --ink-muted: rgba(237, 231, 218, 0.38);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: var(--void-deep);
      color: var(--paper);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    h1, h2, h3 {
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: -0.01em;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ---------- Navigation Bar ---------- */
    .rnav {
      background: rgba(11, 12, 30, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      height: 60px;
      flex: 0 0 60px;
      display: flex;
      align-items: center;
      z-index: 20;
    }

    .rnav-inner {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .rnav-left {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .rnav-back {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13.5px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.65);
      transition: color 0.15s ease;
    }

    .rnav-back:hover {
      color: #ffffff;
    }

    .rnav-back svg {
      width: 15px;
      height: 15px;
    }

    .rnav-brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .rnav-brand svg {
      width: 26px;
      height: 26px;
      flex: none;
    }

    .rnav-brand span {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: #fff;
    }

    .rnav-brand span em {
      font-style: normal;
      color: var(--violet);
    }

    .rnav-account {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13.5px;
      font-weight: 600;
      color: #fff;
    }

    .rnav-account img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* ---------- Room Wrapper ---------- */
    .room-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      height: calc(100vh - 60px);
      position: relative;
    }

    /* ---------- Room Header ---------- */
    .rhead {
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--line);
      background: var(--void-deep);
      flex: 0 0 auto;
    }

    .rhead-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .rhead-icon {
      flex: none;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      background: var(--tint, rgba(156, 140, 251, 0.12));
      border: 1px solid var(--tint-border, rgba(156, 140, 251, 0.3));
    }

    .rhead h1 {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
    }

    .rhead p {
      margin-top: 3px;
      font-size: 13px;
      color: var(--ink-soft);
    }

    .rhead-online {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12.5px;
      color: var(--mint);
      background: rgba(94, 234, 212, 0.06);
      border: 1px solid rgba(94, 234, 212, 0.25);
      border-radius: 999px;
      padding: 6px 14px;
    }

    .rhead-online .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 8px var(--mint);
    }

    /* ---------- Chat Workspace ---------- */
    .chat-layout {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      padding: 0 20px;
    }

    .rlog {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0 100px 0; /* extra bottom padding so messages aren't hidden by the floating input */
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    /* Custom Scrollbar */
    .rlog::-webkit-scrollbar {
      width: 6px;
    }
    .rlog::-webkit-scrollbar-track {
      background: transparent;
    }
    .rlog::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
    }
    .rlog::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    /* Empty state */
    .rlog-empty {
      margin: auto;
      text-align: center;
      color: var(--ink-muted);
      font-size: 14px;
      padding: 40px 20px;
      user-select: none;
    }

    /* Message Bubbles */
    .rmsg {
      max-width: 72%;
      display: flex;
      flex-direction: column;
      gap: 5px;
      animation: fadeInMsg 0.2s ease forwards;
    }

    @keyframes fadeInMsg {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .rmsg.me {
      align-self: flex-end;
      align-items: flex-end;
    }

    .rmsg .who {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--ink-muted);
      font-weight: 500;
      padding-left: 2px;
    }

    .rmsg .who img {
      width: 18px;
      height: 18px;
      border-radius: 50%;
    }

    .rmsg .bubble {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px 16px 16px 4px;
      padding: 11px 16px;
      font-size: 14.5px;
      line-height: 1.5;
      color: var(--paper);
      word-break: break-word;
    }

    .rmsg.me .bubble {
      background: linear-gradient(135deg, rgba(156, 140, 251, 0.24) 0%, rgba(81, 66, 196, 0.24) 100%);
      border: 1px solid rgba(156, 140, 251, 0.35);
      border-radius: 16px 16px 4px 16px;
      color: #fff;
    }

    /* ---------- Floating Input Box Area ---------- */
    .rinput-container {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      max-width: 920px;
      margin: 0 auto;
      z-index: 10;
    }

    .rinput-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--void-card);
      border: 1px solid var(--line-subtle);
      border-radius: 16px;
      padding: 6px 6px 6px 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .rinput-row:focus-within {
      border-color: rgba(156, 140, 251, 0.5);
      box-shadow: 0 10px 32px rgba(81, 66, 196, 0.25);
    }

    .rinput-row input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--paper);
      font-family: inherit;
      font-size: 14.5px;
      padding: 8px 0;
    }

    .rinput-row input::placeholder {
      color: var(--ink-muted);
    }

    .rinput-row input:focus {
      outline: none;
    }

    .rinput-row button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--violet-gradient);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 0 22px;
      height: 44px;
      font-family: inherit;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(81, 66, 196, 0.4);
      transition: filter 0.15s ease, transform 0.15s ease, opacity 0.15s ease;
      flex-shrink: 0;
    }

    .rinput-row button:hover:not(:disabled) {
      filter: brightness(1.12);
      transform: translateY(-1px);
    }

    .rinput-row button:active:not(:disabled) {
      transform: translateY(0px);
    }

    .rinput-row button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .rinput-row button svg {
      width: 15px;
      height: 15px;
      stroke-width: 2.2;
    }

    /* ---------- Not Found Page ---------- */
    .rnotfound {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      padding: 40px 20px;
    }

    .rnotfound h2 {
      font-size: 24px;
      color: #fff;
    }

    .rnotfound p {
      color: var(--ink-soft);
      font-size: 14px;
      max-width: 360px;
      line-height: 1.5;
    }

    .rnotfound a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--violet-gradient);
      color: #fff;
      border-radius: 10px;
      padding: 12px 22px;
      font-weight: 600;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <nav class="rnav">
    <div class="rnav-inner">
      <div class="rnav-left">
        <a class="rnav-back" href="/community.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          All communities
        </a>
        <a class="rnav-brand" href="/">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <linearGradient id="rnavLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#9C8CFB"/>
                <stop offset="100%" stop-color="#5142C4"/>
              </linearGradient>
            </defs>
            <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#rnavLogoGrad)"/>
            <path d="M14,44 a22,22 0 1,1 22,26 l-7,10 l-2,-12 a22,22 0 0,1 -13,-24 z" fill="#FFFFFF"/>
            <path d="M86,48 a22,22 0 1,0 -22,26 l7,10 l2,-12 a22,22 0 0,0 13,-24 z" fill="#5EEAD4" fill-opacity="0.88"/>
            <path d="M79,17 l2.6,6.4 6.4,2.6 -6.4,2.6 -2.6,6.4 -2.6,-6.4 -6.4,-2.6 6.4,-2.6 z" fill="#FFB84D"/>
          </svg>
          <span>Friend<em>Hub</em></span>
        </a>
      </div>
      <div class="rnav-account" id="rNavAccount" style="display:none;">
        <img id="rNavAvatar" src="" alt="Avatar">
        <span id="rNavName"></span>
      </div>
    </div>
  </nav>

  <!-- Active Room UI -->
  <div class="room-container" id="rRoomFound">
    <div class="rhead">
      <div class="rhead-left">
        <div class="rhead-icon" id="rHeadIcon">✈️</div>
        <div>
          <h1 id="rHeadName">Travel</h1>
          <p id="rHeadDesc">Trip planning, hidden gems, and flight-deal alerts.</p>
        </div>
      </div>
      <div class="rhead-online">
        <span class="dot"></span>
        <span id="rOnlineCount">—</span>&nbsp;here now
      </div>
    </div>

    <div class="chat-layout">
      <!-- Scrollable Message Stream -->
      <div class="rlog" id="rLog">
        <div class="rlog-empty" id="rLogEmpty">No messages yet — say hi 👋</div>
      </div>

      <!-- Floating Bottom Input Bar -->
      <div class="rinput-container">
        <div class="rinput-row">
          <input type="text" id="rInput" placeholder="Message this room…" maxlength="500" autocomplete="off" disabled>
          <button id="rSendBtn" disabled>
            Send
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Room Not Found State -->
  <div class="rnotfound" id="rNotFound" style="display:none;">
    <h2>Room not found</h2>
    <p>That community doesn't exist, or the link is missing its topic. Head back and pick one from the list.</p>
    <a href="/community.html">Browse communities</a>
  </div>

  <script>
    const COMMUNITIES = {
      "cooking":       { name:"Cooking",              icon:"🍳", desc:"Recipes, techniques, and what's for dinner tonight.",      tint:"rgba(255,184,77,0.14)",  border:"rgba(255,184,77,0.32)" },
      "sports":        { name:"Sports",               icon:"⚽", desc:"Scores, highlights, and hot takes on every league.",       tint:"rgba(94,158,255,0.14)",  border:"rgba(94,158,255,0.32)" },
      "business":      { name:"Business",             icon:"💼", desc:"Strategy, operations, and running a company day to day.", tint:"rgba(156,140,251,0.14)", border:"rgba(156,140,251,0.32)" },
      "learning":      { name:"Learning",             icon:"📚", desc:"Study tips, courses, and figuring things out together.",  tint:"rgba(94,234,212,0.14)",  border:"rgba(94,234,212,0.32)" },
      "coding":        { name:"Coding",               icon:"💻", desc:"Debugging, side projects, and language wars.",            tint:"rgba(156,140,251,0.14)", border:"rgba(156,140,251,0.32)" },
      "startups":      { name:"Startups",             icon:"🚀", desc:"Building, fundraising, and shipping v1.",                 tint:"rgba(255,107,91,0.14)",  border:"rgba(255,107,91,0.32)" },
      "music":         { name:"Music",                icon:"🎵", desc:"New releases, production, and playlist swaps.",          tint:"rgba(255,107,91,0.14)",  border:"rgba(255,107,91,0.32)" },
      "movies-tv":     { name:"Movies & TV",          icon:"🎬", desc:"What to watch next, and spoiler-free discussion.",        tint:"rgba(156,140,251,0.14)", border:"rgba(156,140,251,0.32)" },
      "gaming":        { name:"Gaming",               icon:"🎮", desc:"Squad-up chat, patch notes, and what you're grinding.",   tint:"rgba(94,158,255,0.14)",  border:"rgba(94,158,255,0.32)" },
      "travel":        { name:"Travel",               icon:"✈️", desc:"Trip planning, hidden gems, and flight-deal alerts.",     tint:"rgba(94,234,212,0.14)",  border:"rgba(94,234,212,0.32)" },
      "fitness":       { name:"Fitness",              icon:"🏋️", desc:"Training plans, form checks, and accountability.",        tint:"rgba(255,184,77,0.14)",  border:"rgba(255,184,77,0.32)" },
      "photography":   { name:"Photography",          icon:"📷", desc:"Gear talk, edits, and critique welcome.",                 tint:"rgba(94,158,255,0.14)",  border:"rgba(94,158,255,0.32)" },
      "art-design":    { name:"Art & Design",         icon:"🎨", desc:"Sketches, feedback, and design process chat.",            tint:"rgba(255,107,91,0.14)",  border:"rgba(255,107,91,0.32)" },
      "books":         { name:"Books",                icon:"📖", desc:"What you're reading and what's worth the hype.",         tint:"rgba(94,234,212,0.14)",  border:"rgba(94,234,212,0.32)" },
      "finance":       { name:"Finance & Investing",  icon:"💰", desc:"Markets, budgeting, and long-term money talk.",           tint:"rgba(255,184,77,0.14)",  border:"rgba(255,184,77,0.32)" },
      "science":       { name:"Science",              icon:"🔬", desc:"New research, weird facts, and honest questions.",       tint:"rgba(94,158,255,0.14)",  border:"rgba(94,158,255,0.32)" },
      "mental-health": { name:"Mental Health",        icon:"🧠", desc:"Supportive, judgment-free peer conversation.",            tint:"rgba(94,234,212,0.14)",  border:"rgba(94,234,212,0.32)" },
      "parenting":     { name:"Parenting",            icon:"👶", desc:"Trading notes on the hardest job with no manual.",        tint:"rgba(255,184,77,0.14)",  border:"rgba(255,184,77,0.32)" },
      "pets-animals":  { name:"Pets & Animals",       icon:"🐾", desc:"Show off your pet, ask for advice, swap stories.",        tint:"rgba(255,107,91,0.14)",  border:"rgba(255,107,91,0.32)" },
      "relationships": { name:"Relationships & Dating",icon:"❤️", desc:"Advice, venting, and modern-dating chaos.",             tint:"rgba(156,140,251,0.14)", border:"rgba(156,140,251,0.32)" }
    };

    const params = new URLSearchParams(window.location.search);
    const topic = params.get('topic');
    const room = topic ? COMMUNITIES[topic] : null;

    const roomFoundEl = document.getElementById('rRoomFound');
    const notFoundEl = document.getElementById('rNotFound');

    if (!room) {
      roomFoundEl.style.display = 'none';
      notFoundEl.style.display = 'flex';
    } else {
      document.title = `${room.name} — FriendHub Community`;
      const iconEl = document.getElementById('rHeadIcon');
      iconEl.textContent = room.icon;
      iconEl.style.setProperty('--tint', room.tint);
      iconEl.style.setProperty('--tint-border', room.border);
      document.getElementById('rHeadName').textContent = room.name;
      document.getElementById('rHeadDesc').textContent = room.desc;
    }
  </script>

  <!-- Firebase Integration -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  
  <script>
  (function(){
    const topic = new URLSearchParams(window.location.search).get('topic');
    if (!topic || !COMMUNITIES[topic]) return;

    const firebaseConfig = {
      apiKey: "AIzaSyAGq-OE8k2tfF0xIQHMYWIfAQ4JVS69gKs",
      authDomain: "friendhub-9f934.firebaseapp.com",
      projectId: "friendhub-9f934",
      storageBucket: "friendhub-9f934.firebasestorage.app",
      messagingSenderId: "97544296104",
      appId: "1:97544296104:web:d7f7d27e86f1af748e949d"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    const db = firebase.firestore();
    const FieldValue = firebase.firestore.FieldValue;

    const navAccount = document.getElementById('rNavAccount');
    const navAvatar = document.getElementById('rNavAvatar');
    const navName = document.getElementById('rNavName');
    const log = document.getElementById('rLog');
    const logEmpty = document.getElementById('rLogEmpty');
    const input = document.getElementById('rInput');
    const sendBtn = document.getElementById('rSendBtn');
    const onlineCountEl = document.getElementById('rOnlineCount');

    let myUser = null;
    let unsubMessages = null;

    // Enable/disable send button dynamically based on input content
    input.addEventListener('input', () => {
      sendBtn.disabled = !input.value.trim();
    });

    auth.onAuthStateChanged((user) => {
      if (user && !user.isAnonymous) {
        myUser = user;
        navAccount.style.display = 'flex';
        navAvatar.src = user.photoURL || `https://ui-avatars.com/api/?background=5142C4&color=fff&name=${encodeURIComponent(user.displayName || user.email || 'U')}`;
        navName.textContent = (user.displayName || user.email || 'Account').split(' ')[0];
        
        input.disabled = false;
        startRoom();
      } else {
        window.location.href = `/?signin=1&next=${encodeURIComponent(window.location.pathname + window.location.search)}`;
      }
    });

    function escapeHtml(str){
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function addMessageEl(m, mine){
      logEmpty.style.display = 'none';
      const row = document.createElement('div');
      row.className = 'rmsg' + (mine ? ' me' : '');
      const nameHtml = mine ? '' :
        '<div class="who">' +
          (m.senderPhoto ? '<img src="' + escapeHtml(m.senderPhoto) + '" alt="">' : '') +
          '<span>' + escapeHtml(m.senderName || 'Someone') + '</span>' +
        '</div>';
      row.innerHTML = nameHtml + '<div class="bubble"></div>';
      row.querySelector('.bubble').textContent = m.text;
      log.appendChild(row);
      log.scrollTop = log.scrollHeight;
    }

    function startRoom(){
      if (unsubMessages) return;

      const messagesRef = db.collection('communityRooms').doc(topic).collection('messages')
        .orderBy('createdAt', 'asc').limitToLast(50);

      unsubMessages = messagesRef.onSnapshot((snap) => {
        snap.docChanges().forEach((change) => {
          if (change.type === 'added') {
            const m = change.doc.data();
            if (!m.createdAt) return;
            addMessageEl(m, m.sender === myUser.uid);
          }
        });
      }, (err) => {
        console.error('messages listener failed:', err);
        logEmpty.textContent = 'Could not load messages — check Firestore rules for /communityRooms.';
        logEmpty.style.display = 'block';
      });

      touchPresence();
      setInterval(touchPresence, 15000);
      refreshOnlineCount();
      setInterval(refreshOnlineCount, 8000);

      window.addEventListener('pagehide', () => {
        if (myUser) db.collection('roomPresence').doc(`${topic}_${myUser.uid}`).delete().catch(() => {});
      });
    }

    function touchPresence(){
      if (!myUser) return;
      db.collection('roomPresence').doc(`${topic}_${myUser.uid}`).set({
        topic: topic,
        updatedAt: FieldValue.serverTimestamp()
      }, { merge: true }).catch((err) => console.error('room presence write failed:', err));
    }

    function refreshOnlineCount(){
      const cutoff = firebase.firestore.Timestamp.fromMillis(Date.now() - 30000);
      db.collection('roomPresence')
        .where('topic', '==', topic)
        .where('updatedAt', '>', cutoff)
        .get()
        .then((snap) => { 
          onlineCountEl.textContent = snap.size.toLocaleString(); 
        })
        .catch(() => { 
          onlineCountEl.textContent = '—'; 
        });
    }

    function sendMessage(){
      const text = input.value.trim();
      if (!text || !myUser) return;
      input.value = '';
      sendBtn.disabled = true;

      db.collection('communityRooms').doc(topic).collection('messages').add({
        text: text,
        sender: myUser.uid,
        senderName: myUser.displayName || 'Someone',
        senderPhoto: myUser.photoURL || null,
        createdAt: FieldValue.serverTimestamp()
      }).catch((err) => {
        console.error('send failed:', err);
        input.value = text;
        sendBtn.disabled = false;
      });
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', (e) => { 
      if (e.key === 'Enter') sendMessage(); 
    });
  })();
  </script>
</body>
</html>
