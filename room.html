<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community Room — FriendHub</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --void:#14152B;
    --void-deep:#0D0E1F;
    --rail:#0A0B1A;
    --panel:#111226;
    --panel-raise:#161834;
    --paper:#EDE7DA;
    --mint:#5EEAD4;
    --coral:#FF6B5B;
    --violet:#9C8CFB;
    --violet-deep:#5142C4;
    --line:rgba(237,231,218,0.10);
    --line-soft:rgba(237,231,218,0.07);
    --ink-soft:rgba(245,244,251,0.56);
    --ink-dim:rgba(245,244,251,0.36);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--void-deep); overflow:hidden; }
  body{
    font-family:'Inter',sans-serif;
    color:var(--paper);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:'Space Grotesk',sans-serif; margin:0; letter-spacing:-0.01em; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; }
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:rgba(237,231,218,0.12); border-radius:99px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover{ background:rgba(237,231,218,0.22); background-clip:padding-box; }

  /* ================= app shell ================= */
  .app{ display:flex; height:100vh; width:100vw; }

  /* ---------- server rail ---------- */
  .rail{
    flex:none; width:72px; background:var(--rail);
    display:flex; flex-direction:column; align-items:center;
    padding:14px 0; gap:10px;
    border-right:1px solid var(--line);
  }
  .rail-item{
    width:46px; height:46px; border-radius:16px; flex:none;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel); cursor:pointer; position:relative;
    transition:border-radius .18s ease, background .18s ease;
  }
  .rail-item svg{ width:24px; height:24px; }
  .rail-item.home:hover{ border-radius:13px; background:rgba(255,107,91,0.16); color:var(--coral); }
  .rail-item.brand{
    background:linear-gradient(135deg,#9C8CFB,#5142C4); border-radius:16px;
  }
  .rail-item.brand svg{ width:28px; height:28px; }
  .rail-item.brand .pip{
    position:absolute; left:-14px; top:50%; transform:translateY(-50%);
    width:4px; height:22px; border-radius:0 4px 4px 0; background:#fff;
  }
  .rail-divider{ width:28px; height:1px; background:var(--line); margin:2px 0; }
  .rail-tip{ color:var(--ink-dim); font-size:9.5px; letter-spacing:.04em; }

  /* ---------- channel sidebar ---------- */
  .chside{
    flex:none; width:250px; background:var(--panel);
    display:flex; flex-direction:column; min-width:0;
    border-right:1px solid var(--line);
    transition:margin-left .2s ease;
  }
  .chside-head{
    flex:none; padding:16px 16px 12px;
    border-bottom:1px solid var(--line);
  }
  .chside-head-top{ display:flex; align-items:center; gap:8px; }
  .chside-head-top span{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; color:#fff; }
  .chside-head-top span em{ font-style:normal; color:var(--violet); }
  .chside-back{
    display:flex; align-items:center; gap:5px; margin-top:6px;
    font-size:11.5px; font-weight:600; color:var(--ink-dim);
  }
  .chside-back:hover{ color:var(--paper); }
  .chside-back svg{ width:12px; height:12px; }

  .chsearch{ padding:12px 14px 8px; flex:none; }
  .chsearch input{
    width:100%; background:var(--void-deep); border:1px solid var(--line);
    color:var(--paper); border-radius:8px; padding:8px 11px;
    font-family:inherit; font-size:12.5px;
  }
  .chsearch input::placeholder{ color:var(--ink-dim); }
  .chsearch input:focus{ outline:none; border-color:var(--violet); }

  .ch-label{
    padding:10px 16px 6px; flex:none;
    font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink-dim); font-weight:700;
  }
  .ch-list{ flex:1 1 auto; min-height:0; overflow-y:auto; padding:0 8px 10px; }
  .ch-item{
    display:flex; align-items:center; gap:9px;
    padding:6.5px 9px; margin:1px 0; border-radius:6px;
    font-size:13.5px; color:var(--ink-soft); cursor:pointer;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .ch-item:hover{ background:rgba(237,231,218,0.05); color:var(--paper); }
  .ch-item.active{ background:rgba(156,140,251,0.16); color:#fff; }
  .ch-item .em{ flex:none; font-size:14px; width:18px; text-align:center; }
  .ch-item .nm{ overflow:hidden; text-overflow:ellipsis; }
  .ch-empty{ padding:16px; font-size:12.5px; color:var(--ink-dim); text-align:center; }

  .user-panel{
    flex:none; display:flex; align-items:center; gap:9px;
    padding:10px 12px; background:var(--void-deep);
    border-top:1px solid var(--line);
  }
  .user-panel img{ width:32px; height:32px; border-radius:50%; flex:none; }
  .user-panel .ustat{ position:relative; flex:none; }
  .user-panel .ustat .dot{
    position:absolute; right:-1px; bottom:-1px; width:9px; height:9px;
    border-radius:50%; background:var(--mint); border:2px solid var(--void-deep);
  }
  .user-panel .uinfo{ min-width:0; flex:1 1 auto; }
  .user-panel .uinfo .un{ font-size:13px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .user-panel .uinfo .us{ font-size:10.5px; color:var(--mint); }

  /* ---------- main chat column ---------- */
  .chat{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; background:var(--void-deep); }
  #rRoomFound{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }

  .chat-head{
    flex:none; height:58px; padding:0 18px;
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    border-bottom:1px solid var(--line);
    background:rgba(17,18,38,0.5);
  }
  .chat-head-left{ display:flex; align-items:center; gap:11px; min-width:0; }
  .chat-head-icon{
    flex:none; width:32px; height:32px; border-radius:9px;
    display:flex; align-items:center; justify-content:center; font-size:16px;
    background:var(--tint, rgba(156,140,251,0.14));
    border:1px solid var(--tint-border, rgba(156,140,251,0.32));
  }
  .chat-head-text{ min-width:0; }
  .chat-head-text h1{ font-size:15.5px; color:#fff; line-height:1.2; }
  .chat-head-text p{ margin:1px 0 0; font-size:11.5px; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .menu-btn{
    display:none; flex:none; width:32px; height:32px; border-radius:8px;
    background:transparent; border:1px solid var(--line); color:var(--paper);
    align-items:center; justify-content:center; cursor:pointer;
  }
  .menu-btn svg{ width:16px; height:16px; }
  .chat-head-online{
    flex:none; display:flex; align-items:center; gap:6px;
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--mint);
    background:rgba(94,234,212,0.08); border:1px solid rgba(94,234,212,0.22);
    border-radius:999px; padding:5px 11px; white-space:nowrap;
  }
  .chat-head-online .dot{ width:6px; height:6px; border-radius:50%; background:var(--mint); box-shadow:0 0 0 3px rgba(94,234,212,0.15); }

  .chat-log{
    flex:1 1 auto; min-height:0; overflow-y:auto;
    padding:14px 0 8px;
    display:flex; flex-direction:column;
  }
  .chat-log-empty{
    margin:auto; text-align:center; color:var(--ink-dim); font-size:13px; padding:40px 20px;
  }

  .mrow{ display:flex; gap:13px; padding:2.5px 18px; position:relative; }
  .mrow:hover{ background:rgba(255,255,255,0.025); }
  .mrow.start{ margin-top:9px; }
  .avcol{ flex:none; width:36px; padding-top:1px; }
  .avcol img{ width:36px; height:36px; border-radius:50%; display:block; }
  .avcol .hovertime{ display:none; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-dim); text-align:center; padding-top:5px; }
  .mrow:not(.start):hover .hovertime{ display:block; }
  .mcontent{ min-width:0; flex:1 1 auto; }
  .mhead{ display:flex; align-items:baseline; gap:8px; }
  .mhead .mname{ font-size:14px; font-weight:600; color:#fff; }
  .mhead .mname.mine{ color:var(--mint); }
  .mhead .mtime{ font-size:10.5px; color:var(--ink-dim); font-family:'IBM Plex Mono',monospace; }
  .mtext{ font-size:14px; line-height:1.48; color:var(--paper); word-wrap:break-word; }

  .chat-input-wrap{ flex:none; padding:10px 18px 16px; }
  .chat-input-row{
    display:flex; align-items:center; gap:8px;
    background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:5px 6px 5px 15px;
  }
  .chat-input-row:focus-within{ border-color:var(--violet); }
  .chat-input-row input{
    flex:1 1 auto; background:transparent; border:none; color:var(--paper);
    font-family:inherit; font-size:14px; padding:9px 0; min-width:0;
  }
  .chat-input-row input::placeholder{ color:var(--ink-dim); }
  .chat-input-row input:focus{ outline:none; }
  .chat-input-row button{
    flex:none; width:36px; height:36px; border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#8B7CF6,#5142C4); color:#fff; border:none;
    cursor:pointer; transition:filter .15s ease, transform .15s ease, opacity .15s ease;
  }
  .chat-input-row button svg{ width:16px; height:16px; }
  .chat-input-row button:hover{ filter:brightness(1.08); }
  .chat-input-row button:active{ transform:translateY(1px); }
  .chat-input-row button:disabled{ opacity:0.35; cursor:not-allowed; }
  .chat-hint{ margin:6px 2px 0; font-size:10.5px; color:var(--ink-dim); }

  .chat-notfound{
    flex:1 1 auto; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; text-align:center; padding:40px 20px;
  }
  .chat-notfound h2{ font-size:19px; color:#fff; }
  .chat-notfound p{ color:var(--ink-soft); font-size:13.5px; max-width:340px; }

  /* ---------- mobile ---------- */
  .backdrop{ display:none; }
  @media (max-width: 860px){
    .rail{ position:fixed; z-index:30; height:100%; transform:translateX(-100%); transition:transform .2s ease; }
    .chside{ position:fixed; left:72px; z-index:30; height:100%; transform:translateX(-140%); transition:transform .2s ease; }
    .app.nav-open .rail, .app.nav-open .chside{ transform:translateX(0); }
    .backdrop{
      display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:20;
    }
    .app.nav-open .backdrop{ display:block; }
    .menu-btn{ display:flex; }
    .mrow{ padding-left:12px; padding-right:12px; }
  }
</style>
</head>
<body>

<div class="app" id="rApp">
  <div class="backdrop" id="rBackdrop"></div>

  <!-- server rail -->
  <aside class="rail">
    <a class="rail-item home" href="/community.html" title="All communities">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </a>
    <div class="rail-divider"></div>
    <div class="rail-item brand" title="FriendHub">
      <div class="pip"></div>
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M14,44 a22,22 0 1,1 22,26 l-7,10 l-2,-12 a22,22 0 0,1 -13,-24 z" fill="#FFFFFF"/>
        <path d="M86,48 a22,22 0 1,0 -22,26 l7,10 l2,-12 a22,22 0 0,0 13,-24 z" fill="#5EEAD4" fill-opacity="0.88"/>
        <path d="M79,17 l2.6,6.4 6.4,2.6 -6.4,2.6 -2.6,6.4 -2.6,-6.4 -6.4,-2.6 6.4,-2.6 z" fill="#FFB84D"/>
      </svg>
    </div>
  </aside>

  <!-- channel sidebar -->
  <aside class="chside">
    <div class="chside-head">
      <div class="chside-head-top">
        <span>Friend<em>Hub</em></span>
      </div>
      <a class="chside-back" href="/community.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        All communities
      </a>
    </div>
    <div class="chsearch">
      <input type="text" id="rChSearch" placeholder="Find a room">
    </div>
    <div class="ch-label">Rooms</div>
    <div class="ch-list" id="rChList"></div>
    <div class="user-panel" id="rUserPanel">
      <div class="ustat"><img id="rNavAvatar" src="https://ui-avatars.com/api/?background=5142C4&color=fff&name=U" alt=""><span class="dot"></span></div>
      <div class="uinfo">
        <div class="un" id="rNavName">Signing in…</div>
        <div class="us">Online</div>
      </div>
    </div>
  </aside>

  <!-- main chat -->
  <main class="chat">
    <div id="rRoomFound">
      <div class="chat-head">
        <div class="chat-head-left">
          <button class="menu-btn" id="rMenuBtn" aria-label="Open rooms">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="chat-head-icon" id="rHeadIcon"></div>
          <div class="chat-head-text">
            <h1 id="rHeadName"></h1>
            <p id="rHeadDesc"></p>
          </div>
        </div>
        <div class="chat-head-online"><span class="dot"></span><span id="rOnlineCount">…</span>&nbsp;here now</div>
      </div>

      <div class="chat-log" id="rLog">
        <div class="chat-log-empty" id="rLogEmpty">No messages yet — say hi 👋</div>
      </div>

      <div class="chat-input-wrap">
        <div class="chat-input-row">
          <input type="text" id="rInput" placeholder="Message this room…" maxlength="500">
          <button id="rSendBtn" disabled aria-label="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="chat-notfound" id="rNotFound" style="display:none;">
      <h2>Room not found</h2>
      <p>That community doesn't exist, or the link is missing its topic. Pick one from the sidebar instead.</p>
    </div>
  </main>
</div>

<script>
  // Kept in sync with the same list on /community/index.html.
  const COMMUNITIES = {
    "cooking":       { name:"Cooking",             icon:"🍳", desc:"Recipes, techniques, and what's for dinner tonight.",      tint:"rgba(255,184,77,0.14)",  border:"rgba(255,184,77,0.32)" },
    "sports":        { name:"Sports",              icon:"⚽", desc:"Scores, highlights, and hot takes on every league.",       tint:"rgba(94,158,255,0.14)",  border:"rgba(94,158,255,0.32)" },
    "business":      { name:"Business",            icon:"💼", desc:"Strategy, operations, and running a company day to day.", tint:"rgba(156,140,251,0.14)", border:"rgba(156,140,251,0.32)" },
    "learning":      { name:"Learning",             icon:"📚", desc:"Study tips, courses, and figuring things out together.",  tint:"rgba(94,234,212,0.14)",  border:"rgba(94,234,212,0.32)" },
    "coding":        { name:"Coding",               icon:"💻", desc:"Debugging, side projects, and language wars.",            tint:"rgba(156,140,251,0.14)", border:"rgba(156,140,251,0.32)" },
    "startups":      { name:"Startups",             icon:"🚀", desc:"Building, fundraising, and shipping v1.",                 tint:"rgba(255,107,91,0.14)",  border:"rgba(255,107,91,0.32)" },
    "music":         { name:"Music",                icon:"🎵", desc:"New releases, production, and playlist swaps.",          tint:"rgba(255,107,91,0.14)",  border:"rgba(255,107,91,0.32)" },
    "movies-tv":     { name:"Movies & TV",          icon:"🎬", desc:"What to watch next, and spoiler-free discussion.",        tint:"rgba(156,140,251,0.14)", border:"rgba(156,140,251,0.32)" },
    "gaming":        { name:"Gaming",               icon:"🎮", desc:"Squad-up chat, patch notes, and what you're grinding.",   tint:"rgba(94,158,255,0.14)",  border:"rgba(94,158,255,0.32)" },
    "travel":        { name:"Travel",               icon:"✈️", desc:"Trip planning, hidden gems, and flight-deal alerts.",     tint:"rgba(94,234,212,0.14)",  border:"rgba(94,234,212,0.32)" },
    "fitness":       { name:"Fitness",              icon:"🏋️", desc:"Training plans, form checks, and accountability.",        tint:"rgba(255,184,77,0.14)",  border:"rgba(255,184,77,0.32)" },
    "photography":   { name:"Photography",          icon:"📷", desc:"Gear talk, edits, and critique welcome.",                 tint:"rgba(94,158,255,0.14)",  border:"rgba(94,158,255,0.32)" },
    "art-design":    { name:"Art & Design",         icon:"🎨", desc:"Sketches, feedback, and design process chat.",            tint:"rgba(255,107,91,0.14)",  border:"rgba(255,107,91,0.32)" },
    "books":         { name:"Books",                icon:"📖", desc:"What you're reading and what's worth the hype.",         tint:"rgba(94,234,212,0.14)",  border:"rgba(94,234,212,0.32)" },
    "finance":       { name:"Finance & Investing",  icon:"💰", desc:"Markets, budgeting, and long-term money talk.",           tint:"rgba(255,184,77,0.14)",  border:"rgba(255,184,77,0.32)" },
    "science":       { name:"Science",              icon:"🔬", desc:"New research, weird facts, and honest questions.",       tint:"rgba(94,158,255,0.14)",  border:"rgba(94,158,255,0.32)" },
    "mental-health": { name:"Mental Health",        icon:"🧠", desc:"Supportive, judgment-free peer conversation.",            tint:"rgba(94,234,212,0.14)",  border:"rgba(94,234,212,0.32)" },
    "parenting":     { name:"Parenting",            icon:"👶", desc:"Trading notes on the hardest job with no manual.",        tint:"rgba(255,184,77,0.14)",  border:"rgba(255,184,77,0.32)" },
    "pets-animals":  { name:"Pets & Animals",       icon:"🐾", desc:"Show off your pet, ask for advice, swap stories.",        tint:"rgba(255,107,91,0.14)",  border:"rgba(255,107,91,0.32)" },
    "relationships": { name:"Relationships & Dating", icon:"❤️", desc:"Advice, venting, and modern-dating chaos.",             tint:"rgba(156,140,251,0.14)", border:"rgba(156,140,251,0.32)" }
  };

  const appEl = document.getElementById('rApp');
  const backdrop = document.getElementById('rBackdrop');
  const menuBtn = document.getElementById('rMenuBtn');
  const chList = document.getElementById('rChList');
  const chSearch = document.getElementById('rChSearch');
  const roomFoundEl = document.getElementById('rRoomFound');
  const notFoundEl = document.getElementById('rNotFound');

  function openNav(){ appEl.classList.add('nav-open'); }
  function closeNav(){ appEl.classList.remove('nav-open'); }
  menuBtn.addEventListener('click', openNav);
  backdrop.addEventListener('click', closeNav);

  function renderChannelList(filter){
    const q = (filter || '').trim().toLowerCase();
    const currentTopic = new URLSearchParams(window.location.search).get('topic');
    chList.innerHTML = '';
    const entries = Object.entries(COMMUNITIES).filter(([key, room]) =>
      !q || room.name.toLowerCase().includes(q)
    );
    if (!entries.length){
      chList.innerHTML = '<div class="ch-empty">No rooms match “' + q + '”</div>';
      return;
    }
    entries.forEach(([key, room]) => {
      const item = document.createElement('a');
      item.className = 'ch-item' + (key === currentTopic ? ' active' : '');
      item.href = '/room.html?topic=' + key;
      item.innerHTML = '<span class="em">' + room.icon + '</span><span class="nm">' + room.name + '</span>';
      item.addEventListener('click', (e) => {
        e.preventDefault();
        closeNav();
        window.selectRoom(key);
      });
      chList.appendChild(item);
    });
  }
  chSearch.addEventListener('input', () => renderChannelList(chSearch.value));
  renderChannelList('');

  window.currentTopic = null;
  window.selectRoom = function(topic){
    const room = COMMUNITIES[topic];
    if (!room) {
      roomFoundEl.style.display = 'none';
      notFoundEl.style.display = 'flex';
      return;
    }
    window.currentTopic = topic;
    try { history.replaceState(null, '', '/room.html?topic=' + topic); } catch (e) { /* ignore (e.g. file:// preview) */ }
    document.title = room.name + ' — FriendHub Community';
    roomFoundEl.style.display = 'flex';
    notFoundEl.style.display = 'none';
    document.getElementById('rHeadIcon').textContent = room.icon;
    document.getElementById('rHeadIcon').style.setProperty('--tint', room.tint);
    document.getElementById('rHeadIcon').style.setProperty('--tint-border', room.border);
    document.getElementById('rHeadName').textContent = room.name;
    document.getElementById('rHeadDesc').textContent = room.desc;
    renderChannelList(chSearch.value);
    if (window.rMountRoom) window.rMountRoom(topic);
  };

  const initialTopic = new URLSearchParams(window.location.search).get('topic') || Object.keys(COMMUNITIES)[0];
  window.selectRoom(initialTopic);
</script>

<!-- ============================================================
  Firebase: auth gate, live messages, send, presence/online count.
  Reuses the same project as the main FriendHub page.

  Firestore layout used here (add rules for these — see notes below):
    /communityRooms/{topic}/messages/{messageId}
      { text, sender (uid), senderName, senderPhoto, createdAt }
    /roomPresence/{topic}_{uid}
      { topic, updatedAt }   -- same shape /community/index.html already reads
============================================================= -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
(function(){
  const firebaseConfig = {
    apiKey: "AIzaSyAGq-OE8k2tfF0xIQHMYWIfAQ4JVS69gKs",
    authDomain: "friendhub-9f934.firebaseapp.com",
    projectId: "friendhub-9f934",
    storageBucket: "friendhub-9f934.firebasestorage.app",
    messagingSenderId: "97544296104",
    appId: "1:97544296104:web:d7f7d27e86f1af748e949d"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const FieldValue = firebase.firestore.FieldValue;

  const userPanel = document.getElementById('rUserPanel');
  const navAvatar = document.getElementById('rNavAvatar');
  const navName = document.getElementById('rNavName');
  const log = document.getElementById('rLog');
  const logEmpty = document.getElementById('rLogEmpty');
  const input = document.getElementById('rInput');
  const sendBtn = document.getElementById('rSendBtn');
  const onlineCountEl = document.getElementById('rOnlineCount');

  let myUser = null;
  let unsubMessages = null;
  let presenceInterval = null;
  let onlineInterval = null;
  let activeTopic = null;
  let lastRender = null; // { uid, ts } for message grouping

  auth.onAuthStateChanged((user) => {
    if (user && !user.isAnonymous) {
      myUser = user;
      userPanel.style.display = 'flex';
      navAvatar.src = user.photoURL || ('https://ui-avatars.com/api/?background=5142C4&color=fff&name=' + encodeURIComponent(user.displayName || user.email || 'U'));
      navName.textContent = (user.displayName || user.email || 'Account').split(' ')[0];
      input.disabled = false;
      sendBtn.disabled = false;
      if (window.currentTopic) mountRoom(window.currentTopic);
    } else {
      // Anonymous or fully signed out — chat rooms are a gated action, same
      // as Start on the main page, so bounce to home where the sign-in
      // overlay lives rather than duplicating that flow here.
      window.location.href = '/?signin=1&next=' + encodeURIComponent(window.location.pathname + window.location.search);
    }
  });

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function fmtTime(date){
    if (!date) return '';
    return date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }

  function addMessageEl(m, mine){
    logEmpty.style.display = 'none';
    const ts = m.createdAt && m.createdAt.toDate ? m.createdAt.toDate() : new Date();
    const grouped = lastRender && lastRender.uid === m.sender && (ts - lastRender.ts) < 5 * 60 * 1000;

    const row = document.createElement('div');
    row.className = 'mrow' + (grouped ? '' : ' start');

    const avcol = document.createElement('div');
    avcol.className = 'avcol';
    if (grouped) {
      avcol.innerHTML = '<div class="hovertime">' + fmtTime(ts) + '</div>';
    } else {
      const img = document.createElement('img');
      img.src = m.senderPhoto || ('https://ui-avatars.com/api/?background=5142C4&color=fff&name=' + encodeURIComponent(m.senderName || 'U'));
      img.alt = '';
      avcol.appendChild(img);
    }

    const content = document.createElement('div');
    content.className = 'mcontent';
    if (!grouped) {
      const head = document.createElement('div');
      head.className = 'mhead';
      head.innerHTML =
        '<span class="mname' + (mine ? ' mine' : '') + '">' + escapeHtml(m.senderName || 'Someone') + '</span>' +
        '<span class="mtime">' + fmtTime(ts) + '</span>';
      content.appendChild(head);
    }
    const text = document.createElement('div');
    text.className = 'mtext';
    text.textContent = m.text;
    content.appendChild(text);

    row.appendChild(avcol);
    row.appendChild(content);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;

    lastRender = { uid: m.sender, ts: ts };
  }

  function teardownRoom(){
    if (unsubMessages) { unsubMessages(); unsubMessages = null; }
    if (presenceInterval) { clearInterval(presenceInterval); presenceInterval = null; }
    if (onlineInterval) { clearInterval(onlineInterval); onlineInterval = null; }
    if (myUser && activeTopic) {
      db.collection('roomPresence').doc(activeTopic + '_' + myUser.uid).delete().catch(() => {});
    }
    log.innerHTML = '<div class="chat-log-empty" id="rLogEmpty">No messages yet — say hi 👋</div>';
    lastRender = null;
    onlineCountEl.textContent = '…';
  }

  function mountRoom(topic){
    if (!myUser) return; // wait for auth
    if (activeTopic === topic && unsubMessages) return; // already active
    teardownRoom();
    activeTopic = topic;

    const messagesRef = db.collection('communityRooms').doc(topic).collection('messages')
      .orderBy('createdAt', 'asc').limitToLast(50);

    const localLogEmpty = document.getElementById('rLogEmpty');
    unsubMessages = messagesRef.onSnapshot((snap) => {
      snap.docChanges().forEach((change) => {
        if (change.type === 'added') {
          const m = change.doc.data();
          if (!m.createdAt) return; // ignore the optimistic local echo firestore sometimes emits pre-write
          addMessageEl(m, m.sender === myUser.uid);
        }
      });
    }, (err) => {
      console.error('messages listener failed:', err);
      const el = document.getElementById('rLogEmpty');
      if (el) {
        el.textContent = 'Could not load messages — check Firestore rules for /communityRooms.';
        el.style.display = 'block';
      }
    });

    touchPresence();
    presenceInterval = setInterval(touchPresence, 15000);
    refreshOnlineCount();
    onlineInterval = setInterval(refreshOnlineCount, 8000);
  }
  window.rMountRoom = mountRoom;

  window.addEventListener('pagehide', () => {
    if (myUser && activeTopic) db.collection('roomPresence').doc(activeTopic + '_' + myUser.uid).delete().catch(() => {});
  });

  function touchPresence(){
    if (!myUser || !activeTopic) return;
    db.collection('roomPresence').doc(activeTopic + '_' + myUser.uid).set({
      topic: activeTopic,
      updatedAt: FieldValue.serverTimestamp()
    }, { merge: true }).catch((err) => console.error('room presence write failed:', err));
  }

  function refreshOnlineCount(){
    if (!activeTopic) return;
    const topic = activeTopic;
    const cutoff = firebase.firestore.Timestamp.fromMillis(Date.now() - 30000);
    db.collection('roomPresence')
      .where('topic', '==', topic)
      .where('updatedAt', '>', cutoff)
      .get()
      .then((snap) => { if (activeTopic === topic) onlineCountEl.textContent = snap.size.toLocaleString(); })
      .catch(() => { if (activeTopic === topic) onlineCountEl.textContent = '—'; });
  }

  function sendMessage(){
    const text = input.value.trim();
    if (!text || !myUser || !activeTopic) return;
    input.value = '';
    db.collection('communityRooms').doc(activeTopic).collection('messages').add({
      text: text,
      sender: myUser.uid,
      senderName: myUser.displayName || 'Someone',
      senderPhoto: myUser.photoURL || null,
      createdAt: FieldValue.serverTimestamp()
    }).catch((err) => {
      console.error('send failed:', err);
      input.value = text; // restore so they don't lose what they typed
    });
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
})();
</script>

</body>
</html>
