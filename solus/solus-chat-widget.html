<!--
  SOLUS CHAT WIDGET
  Paste this block just before </body> in your Solus index.html (or wherever your site's main HTML lives).
  Update BACKEND_URL below to your deployed Railway backend URL once it's live.
-->

<style>
  #solus-chat-bubble {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #111;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    z-index: 9999;
    font-size: 24px;
    transition: transform 0.15s ease;
  }
  #solus-chat-bubble:hover { transform: scale(1.06); }

  #solus-chat-window {
    position: fixed;
    bottom: 92px;
    right: 24px;
    width: 340px;
    max-width: 90vw;
    height: 460px;
    max-height: 70vh;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    display: none;
    flex-direction: column;
    overflow: hidden;
    z-index: 9999;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #solus-chat-window.open { display: flex; }

  #solus-chat-header {
    background: #111;
    color: #fff;
    padding: 14px 16px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #solus-chat-close { cursor: pointer; opacity: 0.7; font-size: 18px; }
  #solus-chat-close:hover { opacity: 1; }

  #solus-chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #fafafa;
  }
  .solus-msg { max-width: 80%; padding: 9px 12px; border-radius: 12px; font-size: 14px; line-height: 1.4; }
  .solus-msg.user { align-self: flex-end; background: #111; color: #fff; border-bottom-right-radius: 3px; }
  .solus-msg.bot { align-self: flex-start; background: #eee; color: #111; border-bottom-left-radius: 3px; }
  .solus-msg.typing { align-self: flex-start; background: #eee; color: #999; font-style: italic; }

  #solus-chat-input-row {
    display: flex;
    border-top: 1px solid #eee;
    padding: 10px;
    gap: 8px;
  }
  #solus-chat-input {
    flex: 1;
    border: 1px solid #ddd;
    border-radius: 20px;
    padding: 9px 14px;
    font-size: 14px;
    outline: none;
  }
  #solus-chat-input:focus { border-color: #111; }
  #solus-chat-send {
    background: #111;
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 9px 16px;
    font-size: 14px;
    cursor: pointer;
  }
  #solus-chat-send:disabled { opacity: 0.5; cursor: default; }
</style>

<div id="solus-chat-bubble">💬</div>

<div id="solus-chat-window">
  <div id="solus-chat-header">
    <span>Solus Support</span>
    <span id="solus-chat-close">✕</span>
  </div>
  <div id="solus-chat-messages">
    <div class="solus-msg bot">Hi! I'm here to help with sizing, orders, shipping, and anything else about Solus. What can I help with?</div>
  </div>
  <div id="solus-chat-input-row">
    <input id="solus-chat-input" type="text" placeholder="Type a message..." />
    <button id="solus-chat-send">Send</button>
  </div>
</div>

<script>
(function () {
  // 🔧 UPDATE THIS to your deployed Railway backend URL
  const BACKEND_URL = 'https://solus-chat-backend-production.up.railway.app/api/chat';

  const bubble = document.getElementById('solus-chat-bubble');
  const win = document.getElementById('solus-chat-window');
  const closeBtn = document.getElementById('solus-chat-close');
  const messagesEl = document.getElementById('solus-chat-messages');
  const input = document.getElementById('solus-chat-input');
  const sendBtn = document.getElementById('solus-chat-send');

  let history = []; // { role: 'user' | 'assistant', content: string }

  bubble.addEventListener('click', () => win.classList.toggle('open'));
  closeBtn.addEventListener('click', () => win.classList.remove('open'));

  function addMessage(text, role) {
    const div = document.createElement('div');
    div.className = 'solus-msg ' + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    sendBtn.disabled = true;
    addMessage(text, 'user');
    history.push({ role: 'user', content: text });

    const typingEl = addMessage('Typing...', 'typing');

    try {
      const res = await fetch(BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history }),
      });

      const data = await res.json();
      typingEl.remove();

      if (!res.ok) {
        addMessage(data.error || 'Something went wrong. Please try again.', 'bot');
        return;
      }

      addMessage(data.reply, 'bot');
      history.push({ role: 'assistant', content: data.reply });
    } catch (err) {
      typingEl.remove();
      addMessage('Connection error. Please try again in a moment.', 'bot');
    } finally {
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });
})();
</script>
