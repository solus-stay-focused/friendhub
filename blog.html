<style>
  :root{
    --bg:#0B0F1A;
    --bg-2:#0E1424;
    --panel:#121A2C;
    --panel-2:#0D1322;
    --line:#212C42;
    --text:#EDE7DA;
    --muted:#8B96AC;
    --violet:#9C8CFB;
    --violet-dim:#5142C4;
    --mint:#5EEAD4;
    --amber:#FFB84D;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  ::selection{background:rgba(156,140,251,0.35);}

  body::before{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(640px 420px at 12% -6%, rgba(156,140,251,0.16), transparent 60%),
      radial-gradient(560px 380px at 96% 8%, rgba(94,234,212,0.10), transparent 60%),
      var(--bg);
  }

  nav.topnav{
    position:sticky;top:0;z-index:50;
    background:rgba(11,15,26,0.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .topnav-inner{
    max-width:1100px;margin:0 auto;padding:16px 24px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;}
  .brand svg{width:30px;height:30px;flex-shrink:0;}
  .brand span{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;letter-spacing:-0.01em;color:#fff;}
  .brand span em{font-style:normal;color:var(--mint);}
  .topnav a.back{
    display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--muted);
    font-size:13.5px;font-weight:500;padding:8px 14px;border-radius:20px;border:1px solid var(--line);
    transition:color .15s, border-color .15s, background .15s;
  }
  .topnav a.back:hover{color:var(--text);border-color:var(--violet-dim);background:rgba(156,140,251,0.06);}
  .topnav a.back svg{width:14px;height:14px;}

  header.hero{max-width:1100px;margin:0 auto;padding:64px 24px 44px;position:relative;}
  header.hero .eyebrow{
    display:inline-flex;align-items:center;gap:7px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;
    letter-spacing:.06em;color:var(--mint);background:rgba(94,234,212,0.08);border:1px solid rgba(94,234,212,0.28);
    padding:5px 12px;border-radius:20px;margin-bottom:20px;
  }
  header.hero .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 6px var(--mint);}
  header.hero h1{
    font-family:'Space Grotesk',sans-serif;font-size:clamp(34px,6vw,56px);margin:0 0 14px;font-weight:700;
    letter-spacing:-0.02em;line-height:1.05;
    background:linear-gradient(100deg,#fff 40%, var(--violet) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  header.hero p{color:var(--muted);font-size:16px;max-width:540px;line-height:1.65;margin:0;}
  header.hero .rule{margin-top:40px;height:1px;background:linear-gradient(90deg, var(--line), transparent);}

  main{max-width:1100px;margin:0 auto;padding:8px 24px 90px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:22px;margin-top:36px;}

  .card{
    background:linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--line);border-radius:14px;overflow:hidden;
    text-decoration:none;display:flex;flex-direction:column;
    transition:border-color .18s, transform .18s, box-shadow .18s;
    position:relative;
  }
  .card:hover{
    border-color:rgba(156,140,251,0.4);transform:translateY(-3px);
    box-shadow:0 16px 32px -18px rgba(0,0,0,0.6), 0 0 0 1px rgba(156,140,251,0.08);
  }
  .card .accent-bar{position:absolute;top:0;left:0;width:3px;height:100%;
    background:linear-gradient(180deg, var(--violet), var(--mint));opacity:0;transition:opacity .18s;}
  .card:hover .accent-bar{opacity:1;}
  .card .cover-wrap{position:relative;width:100%;height:172px;background:var(--panel-2);overflow:hidden;}
  .card img.cover{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease;}
  .card:hover img.cover{transform:scale(1.04);}
  .card-body{padding:19px 21px 21px;flex:1;display:flex;flex-direction:column;}
  .card-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px;}
  .tag-pill{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--violet);background:rgba(156,140,251,0.1);
    border:1px solid rgba(156,140,251,0.2);padding:3px 9px;border-radius:20px;letter-spacing:.02em;}
  .card h2{font-family:'Space Grotesk',sans-serif;font-size:18.5px;margin:0 0 9px;line-height:1.32;font-weight:600;color:#fff;}
  .card p{color:var(--muted);font-size:13.5px;line-height:1.62;margin:0 0 16px;flex:1;}
  .card-meta{display:flex;align-items:center;gap:10px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);
    border-top:1px solid var(--line);padding-top:13px;}
  .card-meta .dot-sep{width:3px;height:3px;border-radius:50%;background:var(--muted);flex-shrink:0;}
  .card-meta .read-link{margin-left:auto;color:var(--mint);display:flex;align-items:center;gap:4px;opacity:0;transform:translateX(-4px);transition:opacity .18s, transform .18s;}
  .card:hover .card-meta .read-link{opacity:1;transform:translateX(0);}

  .empty, .loading{
    text-align:center;color:var(--muted);padding:70px 20px;font-size:14px;
    border:1px dashed var(--line);border-radius:14px;margin-top:36px;
  }
  .loading .spin{
    width:20px;height:20px;margin:0 auto 14px;border-radius:50%;
    border:2px solid var(--line);border-top-color:var(--violet);
    animation:spin 0.85s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  footer{border-top:1px solid var(--line);padding:28px 24px;text-align:center;color:var(--muted);font-size:12.5px;}

  @media (max-width:520px){
    .topnav-inner{padding:14px 18px;}
    header.hero{padding:44px 18px 32px;}
    main{padding:8px 18px 70px;}
  }

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    .card, .card img.cover, .card-meta .read-link{transition:none;}
    .loading .spin{animation:none;}
  }
</style>
</head>
<body>

<header class="hero">
  <span class="eyebrow"><span class="dot"></span>FROM THE TEAM</span>
  <h1>The FriendHub Blog</h1>
  <p>Notes on meeting people online safely, making the most of random video chat, and what we're building next.</p>
  <div class="rule"></div>
</header>

<main>
  <div id="postGrid" class="grid">
    <div class="loading"><div class="spin"></div>Loading posts…</div>
  </div>
</main>

<footer>© <span id="year"></span> FriendHub. All rights reserved.</footer>

<script>document.getElementById("year").textContent = new Date().getFullYear();</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, getDocs, query, where, orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// TODO: replace with your existing FriendHub Firebase config (same as admin-blog.html)
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str || "";
  return d.innerHTML;
}

function readMinutes(html) {
  const words = (html || "").replace(/<[^>]*>/g, " ").split(/\s+/).filter(Boolean).length;
  return Math.max(1, Math.round(words / 200));
}

async function loadPosts() {
  const grid = document.getElementById("postGrid");
  try {
    const q = query(
      collection(db, "blogPosts"),
      where("status", "==", "published"),
      orderBy("publishedAt", "desc")
    );
    const snap = await getDocs(q);
    if (snap.empty) {
      grid.innerHTML = '<div class="empty">No posts published yet — check back soon.</div>';
      return;
    }

    grid.innerHTML = snap.docs.map(d => {
      const p = d.data();
      const date = p.publishedAt?.toDate ? p.publishedAt.toDate().toLocaleDateString(undefined, { year:"numeric", month:"short", day:"numeric" }) : "";
      const cover = p.coverImageUrl ? `<div class="cover-wrap"><img class="cover" src="${escapeHtml(p.coverImageUrl)}" alt="${escapeHtml(p.title)}" loading="lazy"></div>` : "";
      const tags = (p.tags || []).slice(0, 3).map(t => `<span class="tag-pill">${escapeHtml(t)}</span>`).join("");
      return `
        <a class="card" href="blog-post.html?slug=${encodeURIComponent(p.slug)}">
          <span class="accent-bar"></span>
          ${cover}
          <div class="card-body">
            <div class="card-tags">${tags}</div>
            <h2>${escapeHtml(p.title)}</h2>
            <p>${escapeHtml(p.excerpt)}</p>
            <div class="card-meta">
              <span>${date}</span>
              <span class="dot-sep"></span>
              <span>${readMinutes(p.content)} min read</span>
              <span class="read-link">Read →</span>
            </div>
          </div>
        </a>`;
    }).join("");
  } catch (err) {
    console.error(err);
    grid.innerHTML = '<div class="empty">Couldn\'t load posts. Try refreshing.</div>';
  }
}

loadPosts();
</script>
</body>
