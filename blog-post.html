<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0F1A; --bg-2:#0E1424; --panel:#121A2C; --panel-2:#0D1322; --line:#212C42;
    --text:#EDE7DA; --muted:#8B96AC; --violet:#9C8CFB; --violet-dim:#5142C4;
    --mint:#5EEAD4; --amber:#FFB84D;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  ::selection{background:rgba(156,140,251,0.35);}

  body::before{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(640px 420px at 12% -6%, rgba(156,140,251,0.16), transparent 60%),
      radial-gradient(560px 380px at 96% 8%, rgba(94,234,212,0.10), transparent 60%),
      var(--bg);
  }

  nav.topnav{
    position:sticky;top:0;z-index:50;
    background:rgba(11,15,26,0.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .topnav-inner{max-width:800px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;}
  .brand svg{width:30px;height:30px;flex-shrink:0;}
  .brand span{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;letter-spacing:-0.01em;color:#fff;}
  .brand span em{font-style:normal;color:var(--mint);}
  .topnav a.back{
    display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--muted);
    font-size:13.5px;font-weight:500;padding:8px 14px;border-radius:20px;border:1px solid var(--line);
    transition:color .15s, border-color .15s, background .15s;
  }
  .topnav a.back:hover{color:var(--text);border-color:var(--violet-dim);background:rgba(156,140,251,0.06);}
  .topnav a.back svg{width:14px;height:14px;}

  main{max-width:760px;margin:0 auto;padding:52px 24px 100px;}

  .loading, .empty{
    text-align:center;color:var(--muted);padding:90px 20px;font-size:14px;
    border:1px dashed var(--line);border-radius:14px;
  }
  .loading .spin{
    width:20px;height:20px;margin:0 auto 14px;border-radius:50%;
    border:2px solid var(--line);border-top-color:var(--violet);
    animation:spin 0.85s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  article{display:none;}
  article.show{display:block;}

  .post-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
  .tag-pill{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--violet);background:rgba(156,140,251,0.1);
    border:1px solid rgba(156,140,251,0.2);padding:3px 9px;border-radius:20px;letter-spacing:.02em;}

  .post-title{
    font-family:'Space Grotesk',sans-serif;font-size:clamp(28px,5vw,42px);font-weight:700;
    letter-spacing:-0.02em;line-height:1.12;margin:0 0 16px;
    background:linear-gradient(100deg,#fff 40%, var(--violet) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .post-meta{
    display:flex;align-items:center;gap:10px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;
    color:var(--muted);margin-bottom:28px;
  }
  .post-meta .dot-sep{width:3px;height:3px;border-radius:50%;background:var(--muted);flex-shrink:0;}

  .post-cover{width:100%;border-radius:14px;overflow:hidden;border:1px solid var(--line);margin-bottom:34px;background:var(--panel-2);}
  .post-cover img{width:100%;display:block;object-fit:cover;max-height:420px;}

  .post-body{font-size:16.5px;line-height:1.75;color:#DCD6C9;}
  .post-body h2{font-family:'Space Grotesk',sans-serif;color:#fff;font-size:24px;margin:36px 0 14px;letter-spacing:-0.01em;}
  .post-body h3{font-family:'Space Grotesk',sans-serif;color:#fff;font-size:19px;margin:28px 0 12px;}
  .post-body p{margin:0 0 18px;}
  .post-body a{color:var(--mint);text-decoration:underline;text-underline-offset:2px;}
  .post-body ul, .post-body ol{margin:0 0 18px;padding-left:22px;}
  .post-body li{margin-bottom:8px;}
  .post-body strong{color:#fff;}
  .post-body img{max-width:100%;border-radius:10px;margin:10px 0;}
  .post-body blockquote{
    margin:22px 0;padding:4px 20px;border-left:3px solid var(--violet);color:var(--muted);font-style:italic;
  }
  .post-body code{
    background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:2px 6px;font-size:0.9em;
    font-family:'IBM Plex Mono',monospace;
  }

  .post-footer{margin-top:56px;padding-top:28px;border-top:1px solid var(--line);text-align:center;}
  .post-footer a.cta{
    display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:#fff;font-weight:600;font-size:14.5px;
    background:linear-gradient(135deg, var(--violet), var(--violet-dim));padding:12px 24px;border-radius:999px;
    transition:transform .15s, box-shadow .15s;
  }
  .post-footer a.cta:hover{transform:translateY(-1px);box-shadow:0 10px 24px -8px rgba(156,140,251,0.5);}

  footer.site-footer{border-top:1px solid var(--line);padding:28px 24px;text-align:center;color:var(--muted);font-size:12.5px;}

  @media (max-width:520px){
    .topnav-inner{padding:14px 18px;}
    main{padding:36px 18px 80px;}
  }
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    .loading .spin{animation:none;}
  }
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">
    <a class="brand" href="/">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="postLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#9C8CFB"/>
            <stop offset="100%" stop-color="#5142C4"/>
          </linearGradient>
        </defs>
        <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#postLogoGrad)"/>
        <path d="M14,44 a22,22 0 1,1 22,26 l-7,10 l-2,-12 a22,22 0 0,1 -13,-24 z" fill="#FFFFFF"/>
        <path d="M86,48 a22,22 0 1,0 -22,26 l7,10 l2,-12 a22,22 0 0,0 13,-24 z" fill="#5EEAD4" fill-opacity="0.88"/>
        <path d="M79,17 l2.6,6.4 6.4,2.6 -6.4,2.6 -2.6,6.4 -2.6,-6.4 -6.4,-2.6 6.4,-2.6 z" fill="#FFB84D"/>

    <a href="/blog" class="back">

<main>
  <div class="loading" id="loadingState"><div class="spin"></div>Loading post…</div>
  <div class="empty" id="emptyState" style="display:none;">Couldn't find this post — it may have been unpublished or the link is wrong.</div>

  <article id="postArticle">
    <div class="post-tags" id="postTags"></div>
    <h1 class="post-title" id="postTitle"></h1>
    <div class="post-meta">
      <span id="postDate"></span>
      <span class="dot-sep"></span>
      <span id="postReadTime"></span>
    </div>
    <div class="post-cover" id="postCoverWrap" style="display:none;">
      <img id="postCoverImg" src="" alt="">
    </div>
    <div class="post-body" id="postBody"></div>
    <div class="post-footer">
      <a class="cta" href="/">Start a chat on FriendHub →</a>
    </div>
  </article>
</main>

<footer class="site-footer">© <span id="year"></span> FriendHub. All rights reserved.</footer>

<script>document.getElementById("year").textContent = new Date().getFullYear();</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, query, where, limit, getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Same FriendHub Firebase project as index.html / admin-blog.html / blog.html.
const firebaseConfig = {
  apiKey: "AIzaSyAGq-OE8k2tfF0xIQHMYWIfAQ4JVS69gKs",
  authDomain: "friendhub-9f934.firebaseapp.com",
  projectId: "friendhub-9f934",
  storageBucket: "friendhub-9f934.firebasestorage.app",
  messagingSenderId: "97544296104",
  appId: "1:97544296104:web:d7f7d27e86f1af748e949d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str || "";
  return d.innerHTML;
}
function readMinutes(html) {
  const words = (html || "").replace(/<[^>]*>/g, " ").split(/\s+/).filter(Boolean).length;
  return Math.max(1, Math.round(words / 200));
}

const params = new URLSearchParams(window.location.search);
const slug = (params.get("slug") || "").trim();

async function loadPost() {
  const loadingEl = document.getElementById("loadingState");
  const emptyEl = document.getElementById("emptyState");
  const articleEl = document.getElementById("postArticle");

  if (!slug) {
    loadingEl.style.display = "none";
    emptyEl.style.display = "block";
    return;
  }

  try {
    const q = query(
      collection(db, "blogPosts"),
      where("slug", "==", slug),
      where("status", "==", "published"),
      limit(1)
    );
    const snap = await getDocs(q);
    if (snap.empty) {
      loadingEl.style.display = "none";
      emptyEl.style.display = "block";
      return;
    }

    const p = snap.docs[0].data();
    const url = `https://www.friendhub.space/blog-post?slug=${encodeURIComponent(p.slug)}`;
    const title = p.title || "FriendHub Blog";
    const metaTitle = p.metaTitle || title;
    const metaDesc = p.metaDescription || p.excerpt || "";
    const dateObj = p.publishedAt?.toDate ? p.publishedAt.toDate() : null;
    const dateStr = dateObj ? dateObj.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "";

    // ---- SEO tags ----
    document.title = `${metaTitle} — FriendHub Blog`;
    document.getElementById("metaTitleTag").textContent = `${metaTitle} — FriendHub Blog`;
    document.getElementById("metaDescTag").setAttribute("content", metaDesc);
    document.getElementById("canonicalTag").setAttribute("href", url);
    document.getElementById("ogTitle").setAttribute("content", metaTitle);
    document.getElementById("ogDesc").setAttribute("content", metaDesc);
    document.getElementById("ogUrl").setAttribute("content", url);
    document.getElementById("twTitle").setAttribute("content", metaTitle);
    document.getElementById("twDesc").setAttribute("content", metaDesc);
    if (p.coverImageUrl) {
      document.getElementById("ogImage").setAttribute("content", p.coverImageUrl);
      document.getElementById("twImage").setAttribute("content", p.coverImageUrl);
    }

    const articleLd = {
      "@context": "https://schema.org",
      "@type": "BlogPosting",
      "headline": title,
      "description": metaDesc,
      "url": url,
      "image": p.coverImageUrl || undefined,
      "datePublished": dateObj ? dateObj.toISOString() : undefined,
      "author": { "@type": "Organization", "name": "FriendHub" },
      "publisher": { "@type": "Organization", "name": "FriendHub", "url": "https://www.friendhub.space/" }
    };
    document.getElementById("articleLd").textContent = JSON.stringify(articleLd);

    // ---- Render ----
    document.getElementById("postTags").innerHTML = (p.tags || []).slice(0, 3)
      .map(t => `<span class="tag-pill">${escapeHtml(t)}</span>`).join("");
    document.getElementById("postTitle").textContent = title;
    document.getElementById("postDate").textContent = dateStr;
    document.getElementById("postReadTime").textContent = `${readMinutes(p.content)} min read`;

    if (p.coverImageUrl) {
      document.getElementById("postCoverImg").src = p.coverImageUrl;
      document.getElementById("postCoverImg").alt = title;
      document.getElementById("postCoverWrap").style.display = "block";
    }

    // Content is authored as trusted HTML by admins in admin-blog.html (Firestore
    // rules restrict writes to approved admin emails), so it's rendered directly —
    // same trust model as admin-blog.html's own editor preview.
    document.getElementById("postBody").innerHTML = p.content || "";

    loadingEl.style.display = "none";
    articleEl.classList.add("show");
  } catch (err) {
    console.error(err);
    loadingEl.style.display = "none";
    emptyEl.textContent = "Couldn't load this post. Try refreshing.";
    emptyEl.style.display = "block";
  }
}

loadPost();
</script>
</body>
</html>
